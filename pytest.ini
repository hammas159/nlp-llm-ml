[pytest]
# Each projects/* is an independent package with its own pyproject.toml and its
# own src/. Collecting them into one session makes their modules shadow each
# other - two projects ship evaluate.py and two more ship corpora.py - so a test
# can import a different project's module under the name it asked for.
#
# Run them the way they are meant to run, one process each:
#     python scripts/test_all.py
norecursedirs = projects shared .venv *.egg-info
